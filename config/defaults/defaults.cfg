# ==============================================================================
# Laghost Configuration File (TOML format)
# All parameters with their descriptions from laghost_parameters.hpp
# ==============================================================================

# ==============================================================================
# [sim] - Simulation settings
# ==============================================================================
[sim]
problem = 1                    # Problem type selector
dim = 2                        # Spatial dimension (2 or 3)
t_final = 1.0e6                # Final simulation time [seconds]
max_tsteps = -1                # Maximum number of time steps (-1 = unlimited)
year = true                    # Use years for time output instead of seconds
visualization = false          # Enable GLVis visualization
vis_steps = 5                  # Visualization frequency (steps between outputs)
visit = false                  # Enable VisIt output
paraview = true                # Enable ParaView output
gfprint = false                # Print grid function data
basename = results/Laghost     # Output directory and file basename
device = cpu                   # Compute device: cpu, cuda, hip, omp
dev = 0                        # Device ID (for multi-GPU systems)
check = false                  # Enable error checking
mem_usage = false              # Print memory usage statistics
fom = false                    # Enable figure-of-merit calculations
gpu_aware_mpi = false          # Use GPU-aware MPI

# ==============================================================================
# [solver] - ODE solver and linear solver settings
# ==============================================================================
[solver]
ode_solver_type = 7            # ODE solver: 1=Euler, 2=RK2, 3=RK3, 4=RK4, 7=RK3SSP
cfl = 0.25                     # CFL safety factor for time step
cg_tol = 1.0e-10               # CG solver tolerance
ftz_tol = 0.0                  # Flush-to-zero tolerance
cg_max_iter = 300              # Maximum CG iterations
p_assembly = false             # Use partial assembly for operators
impose_visc = true             # Impose viscosity in constitutive model

# ==============================================================================
# [control] - Physics control parameters
# ==============================================================================
[control]
lithostatic = true             # Apply lithostatic initial stress
atmospheric = false            # Apply atmospheric pressure at top
init_dt = 1.0                  # Initial time step [seconds]
mscale = 1.0e6                 # Mass scaling factor (u_elastic = mscale * u_tectonic)
gravity = 10.0                 # Gravitational acceleration magnitude [m/s^2]
thickness = 10.0e3             # Reference thickness for pressure [m]
mass_bal = false               # Enable mass balance check
dyn_damping = true             # Enable Cundall dynamic relaxation
dyn_factor = 0.8               # Dynamic relaxation damping coefficient
max_vbc_val = 3.168808781402895e-12  # Maximum velocity BC value [m/s] = 0.1 mm/yr

# ==============================================================================
# [mesh] - Mesh settings
# ==============================================================================
[mesh]
mesh_file = data/meshes/2d_mesh_local.mesh  # Input mesh file path
rs_levels = 2                  # Serial mesh refinement levels
rp_levels = 0                  # Parallel mesh refinement levels
partition_type = 0             # Mesh partition type
order_v = 2                    # Velocity/position FE order (H1 space)
order_e = 1                    # Stress/energy FE order (L2 space)
order_q = -1                   # Quadrature order (-1 = auto)
local_refinement = false       # Enable local mesh refinement
l2_basis = 1                   # L2 basis type: 0=Gauss-Legendre, 1=Gauss-Lobatto

# ==============================================================================
# [bc] - Boundary conditions
# Velocity BC types: 0=free, 1=fixed normal, 2=fixed tangent, 3=fixed all
# val0=x-component, val1=y-component, val2=z-component
# ==============================================================================
[bc]
vbc_unit = cm/yr               # Velocity unit: m/s, mm/yr, cm/yr
vbc_factor = 1.0               # Velocity conversion factor (auto-set from vbc_unit)
# X0 boundary (left, x=x_min)
vbc_x0 = 1                     # BC type on x0 boundary
vbc_x0_val0 = -1.0             # x-velocity component [vbc_unit]
vbc_x0_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_x0_val2 = 0.0              # z-velocity component [vbc_unit]
# X1 boundary (right, x=x_max)
vbc_x1 = 1                     # BC type on x1 boundary
vbc_x1_val0 = 1.0              # x-velocity component [vbc_unit]
vbc_x1_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_x1_val2 = 0.0              # z-velocity component [vbc_unit]
# Z0 boundary (bottom, z=z_min)
vbc_z0 = 0                     # BC type on z0 boundary
vbc_z0_val0 = 0.0              # x-velocity component [vbc_unit]
vbc_z0_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_z0_val2 = 0.0              # z-velocity component [vbc_unit]
# Z1 boundary (top, z=z_max)
vbc_z1 = 0                     # BC type on z1 boundary
vbc_z1_val0 = 0.0              # x-velocity component [vbc_unit]
vbc_z1_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_z1_val2 = 0.0              # z-velocity component [vbc_unit]
# Y0 boundary (front, y=y_min) - 3D only
vbc_y0 = 0                     # BC type on y0 boundary
vbc_y0_val0 = 0.0              # x-velocity component [vbc_unit]
vbc_y0_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_y0_val2 = 0.0              # z-velocity component [vbc_unit]
# Y1 boundary (back, y=y_max) - 3D only
vbc_y1 = 0                     # BC type on y1 boundary
vbc_y1_val0 = 0.0              # x-velocity component [vbc_unit]
vbc_y1_val1 = 0.0              # y-velocity component [vbc_unit]
vbc_y1_val2 = 0.0              # z-velocity component [vbc_unit]
# Winkler foundation (isostatic support at base)
winkler_foundation = true      # Enable Winkler foundation at bottom
winkler_flat = false           # Keep base flat
winkler_rho = 2700.0           # Density of substratum [kg/m^3]
# Surface processes (diffusion on top/bottom)
surf_proc = true               # Enable surface diffusion
surf_diff = 1.0e-7             # Surface diffusion coefficient [m^2/s]
surf_alpha = 0.0               # Surface advection coefficient
base_proc = true               # Enable base diffusion
base_diff = 1.0e-7             # Base diffusion coefficient [m^2/s]
base_alpha = 0.0               # Base advection coefficient

# ==============================================================================
# [mat] - Material properties (arrays for multi-material)
# Arrays must have length = nmat
# ==============================================================================
[mat]
plastic = true                 # Enable plasticity
viscoplastic = false           # Enable viscoplasticity (rate-dependent)
nmat = 3                       # Number of materials
rho = [2700.0,2700.0,2700.0]   # Density [kg/m^3]
lambda = [3e10,3e10,3e10]      # First Lamé parameter [Pa]
mu = [3e10,3e10,3e10]          # Shear modulus (second Lamé parameter) [Pa]
tension_cutoff = [0.0,0.0,0.0] # Tension cutoff stress [Pa] (0 = C/tan(phi))
cohesion0 = [44.0e6,44.0e6,44.0e6]    # Initial cohesion [Pa]
cohesion1 = [4.0e6,4.0e6,4.0e6]       # Final cohesion after weakening [Pa]
friction_angle0 = [30.0,30.0,30.0]    # Initial friction angle [degrees]
friction_angle1 = [30.0,30.0,30.0]    # Final friction angle [degrees]
dilation_angle0 = [0.0,0.0,0.0]       # Initial dilation angle [degrees]
dilation_angle1 = [0.0,0.0,0.0]       # Final dilation angle [degrees]
alpha0 = [0.0,0.0,0.0]         # Plastic strain at weakening start
alpha1 = [0.5,0.5,0.5]         # Plastic strain at weakening end
plastic_viscosity = [1.0,1.0,1.0]     # Plastic viscosity [Pa·s]
# Weak zone initialization
weak_rad = 1.0e3               # Weak zone radius [m]
weak_x = 50.0e3                # Weak zone center x-coordinate [m]
weak_y = 2.00e3                # Weak zone center y-coordinate [m]
weak_z = 0.00e3                # Weak zone center z-coordinate [m]
ini_alpha = 0.5                # Initial plastic strain in weak zone

# ==============================================================================
# [tmop] - Target-Matrix Optimization Paradigm (mesh smoothing/remeshing)
# ==============================================================================
[tmop]
tmop = false                   # Enable TMOP mesh optimization
amr = false                    # Enable adaptive mesh refinement
ale = 0.5                      # ALE interpolation factor (0=Lagrangian, 1=Eulerian)
remesh_steps = 10000000        # Steps between remeshing
mesh_poly_deg = 2              # Mesh polynomial degree
jitter = 0.0                   # Random mesh jitter amplitude
metric_id = 2                  # TMOP metric ID
target_id = 1                  # TMOP target ID
lim_const = 0.0                # Limiting constraint
adapt_lim_const = 0.0          # Adaptive limiting constraint
quad_type = 1                  # Quadrature type
quad_order = 8                 # Quadrature order
solver_type = 0                # TMOP solver type
solver_iter = 20               # Maximum TMOP iterations
solver_rtol = 1e-10            # TMOP solver tolerance
solver_art_type = 0            # Artificial diffusion type
lin_solver = 2                 # Linear solver: 0=CG, 1=MINRES, 2=GMRES
max_lin_iter = 100             # Maximum linear solver iterations
move_bnd = false               # Allow boundary movement
combomet = 0                   # Combination metric type
bal_expl_combo = false         # Balance explicit combination
hradaptivity = false           # Enable h-adaptivity
h_metric_id = -1               # H-adaptivity metric ID
normalization = false          # Enable normalization
verbosity_level = 0            # Output verbosity (0=silent)
fdscheme = false               # Use finite difference scheme
adapt_eval = 0                 # Adaptive evaluation type
exactaction = false            # Use exact action
n_hr_iter = 5                  # Number of h-refinement iterations
n_h_iter = 1                   # Number of h iterations
mesh_node_ordering = 0         # Mesh node ordering type
barrier_type = 0               # Barrier function type
worst_case_type = 0            # Worst-case optimization type
tmop_cond_num = 0.5            # TMOP condition number threshold
