name: Comprehensive CI
on:
  push:
    branches: [ master, main ]
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    name: Full Test Suite
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          libgtest-dev \
          libboost-program-options-dev \
          liblapack-dev \
          libblas-dev \
          libopenmpi-dev \
          openmpi-bin \
          wget \
          ca-certificates \
          valgrind
    - name: Build and install Google Test
      run: |
        cd /usr/src/googletest
        sudo cmake .
        sudo make -j$(nproc)
        sudo make install
    - name: Cache MFEM and dependencies  
      id: cache-mfem
      uses: actions/cache@v4
      with:
        path: |
          ../hypre-2.28.0
          ../hypre
          ../metis-4.0.3
          ../metis-4.0
          ../gslib
          ../mfem
        key: laghost-full-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/comprehensive-ci.yml') }}
        restore-keys: |
          laghost-full-${{ runner.os }}-v1-
    - name: Build MFEM dependencies
      if: steps.cache-mfem.outputs.cache-hit != 'true'
      run: |
        cd ..
        echo "::group::Building HYPRE"
        wget -q https://github.com/hypre-space/hypre/archive/v2.28.0.tar.gz
        tar -xzf v2.28.0.tar.gz
        cd hypre-2.28.0/src
        ./configure --disable-fortran
        make -j$(nproc)
        cd ../..
        ln -sf hypre-2.28.0 hypre
        echo "::endgroup::"
        echo "::group::Building METIS"
        wget -q https://github.com/mfem/tpls/raw/gh-pages/metis-4.0.3.tar.gz
        tar -xzf metis-4.0.3.tar.gz
        cd metis-4.0.3
        make COPTIONS="-fPIC -O2"
        cd ..
        ln -sf metis-4.0.3 metis-4.0
        echo "::endgroup::"
        echo "::group::Building GSLIB"
        git clone --depth 1 https://github.com/Nek5000/gslib.git
        cd gslib
        make CC=mpicc CFLAGS="-fPIC -O2" -j$(nproc)
        cd ..
        echo "::endgroup::"
        echo "::group::Building MFEM"
        git clone --depth 1 https://github.com/mfem/mfem.git
        cd mfem
          echo "=== Directory listing from MFEM perspective ==="
          pwd; ls -la ..; ls ../hypre/src/hypre/include
          echo "================================================"
        make parallel -j$(nproc) \
          MFEM_USE_GSLIB=YES \
          MFEM_USE_METIS_5=NO
        echo "::endgroup::"
    - name: Create symbolic links (for cached build)
      if: steps.cache-mfem.outputs.cache-hit == 'true'
      run: |
        cd ..
        if [ ! -L hypre ] && [ -d hypre-2.28.0 ]; then 
          ln -sf hypre-2.28.0 hypre
        fi
        if [ ! -L metis-4.0 ] && [ -d metis-4.0.3 ]; then 
          ln -sf metis-4.0.3 metis-4.0
        fi
    - name: Build Laghost
      run: |
        echo "::group::Building Laghost"
        make -j$(nproc) MFEM_USE_GSLIB=YES
        echo "::endgroup::"
    - name: Run unit tests
      run: |
        echo "::group::Running Unit Tests"
        make unit-tests
        echo "::endgroup::"
    - name: Run integration tests
      run: |
        echo "::group::Running Integration Tests"
        make test
        echo "::endgroup::"
    - name: Test command line interface
      run: |
        echo "::group::Testing Command Line Interface"
        echo "Testing help command:"
        ./laghost --help
        echo ""
        echo "Testing version info:"
        ./laghost --help 2>&1 | head -10
        echo ""
        echo "Testing config file parsing:"
        timeout 10s ./laghost -i config/defaults/defaults.cfg -tf 0.001 -ms 1 || echo "Test completed"
        echo "::endgroup::"
    - name: Test with different MPI configurations
      run: |
        echo "::group::Testing MPI Configurations"
        echo "Testing serial run:"
        timeout 15s ./laghost -i config/defaults/defaults.cfg -tf 0.001 -ms 2 || echo "Serial test completed"
        echo ""
        echo "Testing with 2 MPI processes:"
        timeout 15s mpirun -np 2 ./laghost -i config/defaults/defaults.cfg -tf 0.001 -ms 2 || echo "MPI test completed" 
        echo "::endgroup::"
    - name: Memory check (basic)
      run: |
        echo "::group::Basic Memory Check"
        echo "Running valgrind on help command:"
        valgrind --error-exitcode=1 --leak-check=no --track-origins=no ./laghost --help
        echo "::endgroup::"
      continue-on-error: true
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/unit/*.log
          *.log
        if-no-files-found: ignore
