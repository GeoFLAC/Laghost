name: Laghost CI - Fast
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libboost-program-options-dev \
          liblapack-dev \
          libblas-dev \
          libopenmpi-dev \
          openmpi-bin \
          wget
    - name: Build Google Test
      run: |
        cd /usr/src/googletest
        sudo cmake .
        sudo make -j2
        sudo make install
    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ../hypre
          ../metis-4.0
          ../gslib
          ../mfem
        key: laghost-deps-${{ runner.os }}-v1
        restore-keys: |
          laghost-deps-${{ runner.os }}-
    - name: Build dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        cd ..
        # Build HYPRE
        echo "Building HYPRE..."
        wget -q https://github.com/hypre-space/hypre/archive/v2.28.0.tar.gz
        tar -xzf v2.28.0.tar.gz
        cd hypre-2.28.0/src
        ./configure --disable-fortran --without-fei --enable-shared
        make -j2
        cd ../..
        # Create proper directory structure for MFEM
        ln -sf hypre-2.28.0/src hypre
        # Build METIS
        echo "Building METIS..."
        wget -q https://github.com/mfem/tpls/raw/gh-pages/metis-4.0.3.tar.gz
        tar -xzf metis-4.0.3.tar.gz
        cd metis-4.0.3
        make COPTIONS="-fPIC -O2"
        cd ..
        ln -sf metis-4.0.3 metis-4.0
        # Build GSLIB
        echo "Building GSLIB with MPI support..."
        git clone https://github.com/Nek5000/gslib.git
        cd gslib
        make CC=mpicc CFLAGS="-fPIC -O2" -j2
        cd ..
        # Build MFEM
