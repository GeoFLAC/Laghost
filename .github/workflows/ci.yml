name: Laghost CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtest-dev \
          libboost-program-options-dev \
          liblapack-dev \
          libblas-dev \
          libopenmpi-dev \
          openmpi-bin \
          gfortran \
          wget
    
    - name: Build and install Google Test
      run: |
        cd /usr/src/googletest
        sudo cmake .
        sudo make -j2
        sudo make install
    
    - name: Setup workspace
      run: |
        cd ..
        pwd
        ls -la
    
    - name: Download and build HYPRE
      run: |
        cd ..
        echo "Downloading HYPRE..."
        wget -q https://github.com/hypre-space/hypre/archive/v2.28.0.tar.gz
        tar -xzf v2.28.0.tar.gz
        cd hypre-2.28.0/src
        echo "Building HYPRE..."
        ./configure --disable-fortran --without-fei --enable-shared
        make -j2
        cd ../..
        ln -sf hypre-2.28.0 hypre
        
    - name: Download and build METIS
      run: |
        cd ..
        echo "Downloading METIS..."
        wget -q https://github.com/mfem/tpls/raw/gh-pages/metis-4.0.3.tar.gz
        tar -xzf metis-4.0.3.tar.gz
        cd metis-4.0.3
        echo "Building METIS..."
        make COPTIONS="-fPIC -O2"
        cd ..
        ln -sf metis-4.0.3 metis-4.0
        
    - name: Download and build GSLIB
      run: |
        cd ..
        echo "Downloading GSLIB..."
        git clone https://github.com/Nek5000/gslib.git
        cd gslib
        echo "Building GSLIB..."
        make CC=gcc CFLAGS="-fPIC -O2" -j2
        cd ..
    
    - name: Download and build MFEM
      run: |
        cd ..
        echo "Downloading MFEM..."
        git clone https://github.com/mfem/mfem.git
        cd mfem
        echo "Building MFEM..."
        make parallel -j2 \
          MFEM_USE_GSLIB=YES \
          MFEM_USE_METIS_5=NO \
          HYPRE_DIR=../hypre \
          METIS_DIR=../metis-4.0 \
          GSLIB_DIR=../gslib
    
    - name: Build Laghost
      run: |
        echo "Building Laghost..."
        make -j2 MFEM_USE_GSLIB=YES
        
    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        make unit-tests
        
    - name: Run integration test
      run: |
        echo "Running integration test..."
        make test
        
    - name: Test help command
      run: |
        echo "Testing help command..."
        ./laghost --help
        
    - name: Test configuration file parsing
      run: |
        echo "Testing configuration file parsing..."
        timeout 10s ./laghost -i config/defaults/defaults.cfg -tf 0.001 -ms 1 || echo "Test completed or timed out as expected"
